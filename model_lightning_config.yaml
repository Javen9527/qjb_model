trainer:
  max_epochs: 50
  accelerator: "cpu"
  log_every_n_steps: 10
  enable_checkpointing: true
  default_root_dir: "./logs"
  
  callbacks:
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        dirpath: "./logs/checkpoints"
        filename: "best_model_{epoch}_{train_loss:.4f}"
        monitor: "train_loss"
        mode: "min"
        save_top_k: 1
        save_last: true
        every_n_epochs: 1

model:
  lr: 0.001
  hidden_dim: 128

data:
  batch_size: 32