trainer:
  max_epochs: 100
  accelerator: "cpu"
  log_every_n_steps: 10
  default_root_dir: "./logs_unconstrained_diffusion"
  enable_checkpointing: true

  callbacks:
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        dirpath: "./logs_unconstrained_diffusion/checkpoints"
        filename: "unconstrained_diffusion_best_{epoch}_{train_loss:.4f}"
        monitor: "train_loss"
        mode: "min"
        save_top_k: 1
        save_last: true
        every_n_epochs: 1

model:
  class_path: model.UnconstrainedDiffusionModel
  init_args:
    lr: 0.0001
    img_size: 32
    in_channels: 1
    base_ch: 64
    ch_mult: [1, 2, 4]
    timesteps: 1000
    beta_schedule: "linear"
    beta_start: 0.0001
    beta_end: 0.02
    save_predictions: true
    predict_save_dir: null  # null: default_root_dir/predictions
    inference_timesteps: null

data:
  class_path: data.UnconstrainedDiffusionData
  init_args:
    batch_size: 64
    num_workers: 0
    img_size: 32
    channels: 1
    train_samples: 5000
    test_samples: 500
    predict_samples: 16
    seed: 42
    grayscale: true
    # dir（PNG/JPG...）or .pt/.npy file
    # train_data_path: null
    # test_data_path: null
    # predict_data_path: null
