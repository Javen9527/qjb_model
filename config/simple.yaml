trainer:
  max_epochs: 50
  accelerator: "cpu"
  log_every_n_steps: 10
  default_root_dir: "./logs"
  enable_checkpointing: true
  
  callbacks:
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        dirpath: "./logs/checkpoints"
        filename: "best_model_{epoch}_{train_loss:.4f}"
        monitor: "train_loss"
        mode: "min"
        save_top_k: 1
        save_last: true
        every_n_epochs: 1

model:
  class_path: model.SimpleModel
  init_args:
    lr: 0.001
    hidden_dim: 128

data:
  class_path: data.SimpleData
  init_args:
    batch_size: 32
    num_workers: 0